        uses: actions/checkout@v4

      - name: Write test feature
        run: |
          cat > docs/data/community.js <<'EOF'
          var json_community = {
            "type": "FeatureCollection",
            "features": [
              {
                "type": "Feature",
                "properties": {
                  "name": "Test locatie",
                  "url": "https://example.com",
                  "description": "test"
                },
                "geometry": {
                  "type": "Point",
                  "coordinates": [4.90, 52.37]
                }
              }
            ]
          };
          EOF
